name: Release

# Push a tag like v0.1.0 to test, pack and publish that version to NuGet, then create a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # NuGet trusted publishing (OIDC): no long-lived API key

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the MCP server metadata
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v | .packages[0].version = $v' \
            src/FsiMcp/.mcp/server.json > server.json.tmp
          mv server.json.tmp src/FsiMcp/.mcp/server.json

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/FsiMcp -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
